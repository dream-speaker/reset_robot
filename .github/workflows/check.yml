name: Check Tibo for Codex resets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tibo-codex-reset-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest -v

      - name: Check posts and notify
        env:
          RSS_FEED_URLS: ${{ vars.RSS_FEED_URLS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python bot.py

      - name: Persist last-seen post
        run: |
          if [ -z "$(git status --porcelain -- state/last_seen.json)" ]; then
            exit 0
          fi
          git config user.name "tibo-reset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_seen.json
          git commit -m "chore: update seen X posts"
          git push
